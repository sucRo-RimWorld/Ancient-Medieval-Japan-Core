name: Stage A validation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-png-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install compositing dependency
        run: python -m pip install --timeout 60 --retries 5 Pillow==12.3.0

      - name: Regression-test fixed template protection
        run: python Tests/test_fixed_template.py

      - name: Validate AMJ art-rule routing
        run: python Tests/test_art_rule_structure.py

      - name: Regression-test boxed reference integrity
        run: python Tests/test_boxed_resource_review.py

      - name: Regression-test masu contents normalization
        run: python Tests/test_normalize_masu_contents.py

      - name: Regression-test generated candidate QA
        run: python Tests/test_generated_asset_qa.py

      - name: Regression-test boxed candidate preparation
        run: python Tests/test_prepare_boxed_resource_candidate.py

      - name: Regression-test PNG validator
        run: python Tests/test_validate_png_assets.py

      - name: Validate all PNG assets
        run: python Tests/validate_png_assets.py

  validate-stage-a:
    needs: validate-png-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject Base MO references and compatibility regressions
        run: python Tests/test_grains_base.py

      - name: Reject flour-chain balance and provider regressions
        run: python Tests/test_grains_chain.py

      - name: Reject environmental crop-choice regressions
        run: python Tests/test_grains_environment.py

      - name: Validate upland rice and seven-crop choice
        run: python Tests/test_upland_rice.py

      - name: Validate independent scenario extraction prototypes
        run: python Tests/test_scenario_extraction.py

      - name: Check out independent Scenarios owner at reviewed commit
        uses: actions/checkout@v5
        with:
          repository: sucRo-RimWorld/Ancient-Medieval-Japan-Scenarios
          ref: cbd5e313f9cb0871f7227e447d3faa7497fd962e
          path: Tests/Fixtures/ScenarioOwner

      - name: Validate actual separate repository pair
        run: python Tests/validate_scenario_pair.py --scenario-root Tests/Fixtures/ScenarioOwner

      - name: Validate Stage A crop and grain processing XML
        run: python Tests/validate_stage_a.py

  validate-windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in Get-ChildItem -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "$($script.FullName): $($parseErrors -join [Environment]::NewLine)"
            }
          }
          Write-Host "Windows PowerShell script parsing: PASS"

      - name: Test Grains profile isolation and byte-preserving staging
        shell: powershell
        run: ./Tests/test_grains_profiles.ps1
