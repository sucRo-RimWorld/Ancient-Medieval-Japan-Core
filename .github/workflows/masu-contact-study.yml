name: Masu contact study artifact

on:
  workflow_dispatch:

jobs:
  render-study:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install compositing dependency
        run: python -m pip install Pillow==12.3.0

      - name: Validate archived v4 diagnostic contract
        run: python Tests/test_masu_template.py

      - name: Render v4 contact study
        run: python Scripts/Art/masu_contact_study.py

      - name: Upload study artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masu-v4-contact-study
          path: build/masu-contact-study/
          if-no-files-found: error
          retention-days: 3
