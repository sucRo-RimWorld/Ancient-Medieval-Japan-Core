name: Workshop payload filtering
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: workshop-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  subscriber-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Add Changenote version and changelog
        run: python Tests/validate_add_changenote.py
      - name: Validate YADA filter and subscriber payload contract
        run: python Tests/validate_workshop_payload.py
